<div class="lang-switch" data-lang-switch>
  <button type="button" class="lang-switch__toggle" data-lang-toggle aria-haspopup="listbox" aria-expanded="false" aria-label="Мова / Language">
    <span class="lang-switch__current" data-lang-current>UA</span>
    <span class="lang-switch__chevron" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </span>
  </button>
  <ul class="lang-switch__menu" role="listbox" aria-label="Вибір мови">
    <li>
      <button type="button" class="lang-switch__option is-active" role="option" aria-selected="true" data-lang="uk" data-lang-code="UA">
        <span class="lang-switch__name">Українська</span>
        <span class="lang-switch__code">UA</span>
      </button>
    </li>
    <li>
      <button type="button" class="lang-switch__option" role="option" aria-selected="false" data-lang="ru" data-lang-code="RU">
        <span class="lang-switch__name">Русский</span>
        <span class="lang-switch__code">RU</span>
      </button>
    </li>
  </ul>
</div>
