<header class="site-header{{#if headerClass}} {{headerClass}}{{/if}}">
  <div class="site-header__left">
    <button type="button" class="site-header__burger" data-menu-open aria-label="Меню">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
    </button>
    <nav class="site-header__nav" aria-label="Основна навігація">
      <a class="site-header__nav-link" href="index.html">Головна</a>
      <a class="site-header__nav-link" href="services.html">Послуги</a>
      <a class="site-header__nav-link" href="prices.html">Ціни</a>
      <a class="site-header__nav-link" href="contacts.html">Контакти</a>
    </nav>
  </div>

  <div class="site-header__center">
    <a class="site-header__logo" href="index.html">
      <img src="{{#if logo}}{{logo}}{{else}}assets/logo-light.svg{{/if}}" alt="Green Padel House">
    </a>
  </div>

  <div class="site-header__right">
    <div class="site-header__lang">{{> lang-switch }}</div>
    <a class="site-header__call" href="booking.html" aria-label="Забронювати корт">
      <span class="site-header__call-label">Забронювати корт</span>
      <span class="site-header__call-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.7"></rect><path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      </span>
    </a>
  </div>
</header>
