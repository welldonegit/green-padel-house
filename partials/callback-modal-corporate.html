<div class="callback" data-callback>
  <div class="callback__overlay" data-callback-close></div>
  <div class="callback__dialog" role="dialog" aria-modal="true" aria-labelledby="corporate-title" data-phone-scope>
    <button type="button" class="callback__close" data-callback-close aria-label="Закрити">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
    </button>
    <h2 class="callback__title" id="corporate-title">Заявка на бронювання кафе для корпоративу</h2>
    <form class="callback__form" novalidate>
      <label class="field">
        <span class="field__label">Ім'я</span>
        <input class="field__input" type="text" name="name" autocomplete="name" placeholder="Ім'я">
      </label>
      <label class="field">
        <span class="field__label">Номер телефону</span>
        <input class="field__input" type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="+38 (___) ___-__-__" data-phone-mask aria-describedby="corporate-phone-error">
        <span class="field__error" id="corporate-phone-error" data-phone-error hidden>Перевірте код оператора</span>
      </label>
      <div class="callback__row">
        <label class="field">
          <span class="field__label">Дата</span>
          <input class="field__input" type="date" name="date">
        </label>
        <label class="field">
          <span class="field__label">Час</span>
          <input class="field__input" type="text" name="time" inputmode="numeric" placeholder="__:__" maxlength="5" data-time-mask>
        </label>
      </div>
      <label class="field">
        <span class="field__label">Кількість людей</span>
        <input class="field__input" type="text" name="guests" inputmode="numeric" placeholder="Наприклад, 20">
      </label>
      <button type="submit" class="btn btn--lime callback__submit" data-phone-submit>Залиште заявку</button>
    </form>
  </div>
</div>
