<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено — Green Padel House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
<div class="page">
  <div class="page__inner">

    <!-- ░░ 404 · COURT ░░ -->
    <section class="error-404" id="error-404">
      <div class="error-404__card">
        <img class="error-404__media" src="assets/court-surface.jpg" alt="">
        <div class="error-404__scrim"></div>

        {{> header }}

        <div class="error-404__court" aria-hidden="true">
          <span class="error-404__court-net"></span>
          <span class="error-404__court-line error-404__court-line--service-l"></span>
          <span class="error-404__court-line error-404__court-line--service-r"></span>
          <span class="error-404__court-line error-404__court-line--center-l"></span>
          <span class="error-404__court-line error-404__court-line--center-r"></span>
        </div>

        <div class="error-404__content">
          <svg class="error-404__num" aria-hidden="true" viewBox="0 0 445 250" preserveAspectRatio="xMidYMid meet">
            <text x="0" y="202" textLength="445" lengthAdjust="spacingAndGlyphs">404</text>
          </svg>
          <h1 class="error-404__title">М'яч вийшов межі корту. Здається, ця сторінка теж</h1>
          <div class="error-404__actions">
            <a class="btn btn--lime btn--wave" href="booking.html"><span>Забронювати корт</span></a>
            <a class="btn btn--white btn--wave" href="index.html"><span>Повернутися на головну</span></a>
          </div>
        </div>
      </div>
    </section>

    {{> burger-menu }}
    {{> footer }}

  </div>
</div>
<script type="module" src="/scripts/error-404.js"></script>
</body>
</html>
